name: Update Changelog

on:
  workflow_call:
    inputs:
      branch:
        description: 'Target branch'
        default: 'main'
        type: string
      version:
        description: 'Released version'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Update Changelog
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      - name: Extract release date from git tag
        id: release_date
        run: |
          TIMESTAMP_OF_RELEASE_COMMIT=$(git log -1 --date=unix --format=%ad "${{ inputs.version }}" 2>/dev/null || date +%s)
          FORMATTED_DATE=$(date -u -d @"$TIMESTAMP_OF_RELEASE_COMMIT" +%Y-%m-%d)
          echo "date=$FORMATTED_DATE" >> "$GITHUB_OUTPUT"

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1.12.0
        with:
          release-date: ${{ steps.release_date.outputs.date }}
          release-notes: ${{ inputs.notes }}
          latest-version: ${{ inputs.version }}
          compare-url-target-revision: ${{ inputs.branch }}
          parse-github-usernames: true

      - name: Commit updated CHANGELOG
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          branch: ${{ inputs.branch }}
          commit_message: "docs(changelog): update for ${{ inputs.version }}"
          file_pattern: CHANGELOG.md
